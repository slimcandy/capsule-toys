# Node comes from .nvmrc.
[build]
  command = "npm run build"
  publish = "dist"

# Pages that were live for a day: the examples are blocks on How it works now.
[[redirects]]
  from = "/about"
  to = "/how-it-works"
  status = 301

[[redirects]]
  from = "/use-cases/*"
  to = "/how-it-works"
  status = 301

[[redirects]]
  from = "/use-cases"
  to = "/how-it-works"
  status = 301

# img-src allows any https: image: Create your own puts a pasted preview image on the page.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' https:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

# Safari opens AR only for this content type; anything else is a download.
[[headers]]
  for = "/models/*"
  [headers.values]
    Content-Type = "model/vnd.usdz+zip"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
