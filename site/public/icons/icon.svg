<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2519"/>
      <stop offset="1" stop-color="#1a100c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#f3b24a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f3b24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#6a4a36" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a1a12" stop-opacity="0.9"/>
